name: Build NOVA CLIENT

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip'i ac
        run: |
          mkdir -p proje
          unzip -o nova-client-1.21.zip -d proje

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Derle
        working-directory: proje
        run: gradle build --no-daemon --stacktrace

      - name: JAR yukle
        uses: actions/upload-artifact@v4
        with:
          name: nova-client-jar
          path: proje/build/libs/*.jar
          if-no-files-found: error
